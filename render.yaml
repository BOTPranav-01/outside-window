services:
  - type: web
    name: outside-window-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_PATH
        value: /var/data/outside-window.db
    disk:
      name: outside-window-data
      mountPath: /var/data
      sizeGB: 1
  - type: worker
    name: outside-window-worker
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/worker.js
